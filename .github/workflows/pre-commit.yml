name: Pre-Commit Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit-check:
    name: Pre-Commit Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run basic formatting checks (fallback)
        id: basic-checks
        run: |
          echo "Running basic formatting checks..."
          
          black_passed=true
          if python -m black --check --diff app/ scripts/ tests/; then
            echo "✅ Black formatting passed"
          else
            echo "❌ Black formatting failed - fix with 'python -m black app/ scripts/ tests/'"
            black_passed=false
          fi
          echo "black_passed=$black_passed" >> $GITHUB_OUTPUT
          
          isort_passed=true
          if python -m isort --check-only --diff app/ scripts/ tests/; then
            echo "✅ Import ordering passed"
          else
            echo "❌ Import ordering failed - fix with 'python -m isort app/ scripts/ tests/'"
            isort_passed=false
          fi
          echo "isort_passed=$isort_passed" >> $GITHUB_OUTPUT
          
          mypy_passed=true
          if python -m mypy app/ --strict; then
            echo "✅ MyPy passed on app/"
          else
            echo "❌ MyPy failed on app/"
            mypy_passed=false
          fi
          echo "mypy_passed=$mypy_passed" >> $GITHUB_OUTPUT

      - name: Try pre-commit (with fallback)
        continue-on-error: true
        id: pre-commit-step
        run: |
          echo "Attempting pre-commit run..."
          if pre-commit run --all-files; then
            echo "✅ Pre-commit passed"
            echo "pre_commit_success=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Pre-commit failed"
            echo "pre_commit_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "## Pre-commit Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Black**: ${{ steps.basic-checks.outputs.black_passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **isort**: ${{ steps.basic-checks.outputs.isort_passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **MyPy**: ${{ steps.basic-checks.outputs.mypy_passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-commit**: ${{ steps.pre-commit-step.outputs.pre_commit_success }}" >> $GITHUB_STEP_SUMMARY
