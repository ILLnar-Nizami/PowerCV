name: Deploy Mkdocs MDocumentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: 'pip'
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mkdocs-${{ hashFiles('docs/requirements.txt', '.github/workflows/documentation.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-mkdocs-
            ${{ runner.os }}-pip-
      
      - run: pip install mkdocs pillow cairosvg mkdocs-material
      
      - run: mkdocs gh-deploy --force
