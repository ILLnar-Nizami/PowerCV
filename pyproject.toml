[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "powercv"
version = "2.0.0"
description = "PowerCV is an AI-powered resume customization platform that tailors your professional profile to match specific job descriptions and generates cover letters."
authors = ["DOSSEH Shalom <dossehdosseh14@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]
license = "MIT"

# CLI entry point
[tool.poetry.scripts]
powercv = "app.cli.main:main"

[tool.poetry.dependencies]
python = "^3.12"

# Core dependencies
python-jose = {extras = ["cryptography"], version = "*"}
passlib = {extras = ["bcrypt"], version = "*"}
fastapi = {extras = ["standard"], version = "*"}
uvicorn = {extras = ["standard"], version = "*"}
motor = "3.6.0"
redis = "4.5.5"
charset-normalizer = "3.3.2"
setuptools = "*"
python-multipart = "*"
authlib = "*"
itsdangerous = "*"
asyncio = "*"
httpx = ">=0.25.0"
websockets = "*"
slowapi = "*"
asgiref = "*"
pymongo = "*"
ruff = "*"
jinja2 = "*"
pyjwt = "*"
markdown = "*"
psutil = "*"
pypdf = "*"
PyPDF2 = "*"
tiktoken = "*"
mkdocs = "*"
mkdocs-material = "*"
PyYAML = ">=6.0"
python-dotenv = ">=1.0.0"
requests = ">=2.31.0"
pydantic = ">=2.0.0"
uvloop = "*"
rich = ">=13.0.0"
click = ">=8.0.0"
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.0.0"
python-magic = ">=0.4.0"


[tool.poetry.group.dev.dependencies]
pytest-mock = ">=3.12.0"
black = ">=23.12.0"
isort = ">=5.13.0"
mypy = ">=1.8.0"
pre-commit = ">=3.6.0"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".github",
    "__pycache__",
    "*.pyc",
    ".venv",
    "venv",
    "tests"
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Enable flake8 rules
select = ["E", "F", "I", "N"]
ignore = ["E501", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "F841", "E722", "F811", "N802", "I001"]
# Enable Pycodestyle's E203 warning
extend-select = ["E203"]
# Enable preview mode for E203 to have an effect
preview = true

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "sqlalchemy"]

[tool.semantic_release]
version_variable = ["pyproject.toml:version"]
branch = "main"
changelog = "CHANGELOG.md"
upload_to_pypi = false
upload_to_release = true
build_command = "pip install poetry && poetry build"
