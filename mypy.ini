[mypy]
python_version = 3.12
warn_return_any = False
warn_unused_configs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False
no_implicit_optional = False
warn_redundant_casts = False
warn_unused_ignores = False
warn_no_return = False
warn_unreachable = False
strict_equality = False
show_error_codes = False

# Ignore missing imports for third-party libraries
ignore_missing_imports = True

# Disable strict optional checking
strict_optional = False

# Allow any expressions
allow_any_expr = True
allow_any_decorated = True
allow_any_explicit = True
allow_any_generics = True

# Disable misc checks
disable_error_code = misc,no-untyped-def,no-untyped-call,no-any-return,type-arg,attr-defined,index,assignment,operator,union-attr,var-annotated,call-arg,unreachable,import-untyped,untyped-decorator,dict-item,return-value,call-overload,used-before-def

# Follow imports for better checking
follow_imports = silent

# Exclude certain directories
exclude = (?x)(
    # Directories
    scripts/.*
    | tests/.*
    | frontend/.*
    | n8n_workflows/.*
    | data/.*
    | docs/.*
    | \.git/.*
    | __pycache__/.*
    | \.venv/.*
    | venv/.*
    | \.env.*
    | coverage.*
    | \.coverage.*
    | htmlcov/.*
    | \.pytest_cache/.*
    | \.mypy_cache/.*
    | \.tox/.*
    | build/.*
    | dist/.*
    | \.eggs/.*
    | \.egg-info/.*
    | \.DS_Store
    | \.vscode/.*
    | \.idea/.*
    | \.kilocode.*
    | debug_repo\.py$
    | cv_example\.py$
    | test_.*\.py$
    | .*test.*\.py$
    )

# Per-module configuration
[mypy-app.main]
disallow_untyped_defs = False

[mypy-app.api.*]
disallow_untyped_defs = False

[mypy-app.services.*]
disallow_untyped_defs = False

[mypy-app.utils.*]
disallow_untyped_defs = False

[mypy-app.tests.*]
disallow_untyped_defs = False

[mypy-tests.*]
disallow_untyped_defs = False