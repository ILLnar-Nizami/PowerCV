version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  powercv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV: 1
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/powercv_test
      - REDIS_URL=redis://redis:6379
      - TESTING=true
      - DEBUG=true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # Mount root-level tests, pytest config, CLI script, and AI service for CI (read-only)
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./app.sh:/app/app.sh:ro
      # Mount app-level tests (ignored by .dockerignore)
      - ./app/tests:/app/app/tests:ro
      # Mount AI service code (needed for AI provider tests)
      - ./ai-service:/app/ai-service:ro
    command: >
      sh -c "
        python -m pytest tests/ -v &&
        python -m pytest app/tests/ -v
      "
